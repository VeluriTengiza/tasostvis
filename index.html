<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ტასოსთვის 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-wash" aria-hidden="true"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <div class="rotate-gate" id="rotate-gate" hidden>
    <div class="rotate-card">
      <div class="phone-icon" aria-hidden="true">
        <span class="phone-body"></span>
      </div>
      <p class="rotate-text">ტასო ტელე გადაატრიალე რო სიგანეზე გეჭიროს</p>
    </div>
  </div>

  <main class="stage" id="stage" hidden>
    <div class="card" id="card">
      <div class="card-glow"></div>
      <div class="panel" id="panel"></div>
    </div>
  </main>

  <audio id="sound-mov" src="sound.mov" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
